name: One-time Next.js security lock refresh

on:
  push:
    branches:
      - security/next-16-3-8-20261011

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Bootstrap security lock refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated security branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/next-16-3-8-20261011
          persist-credentials: true
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Generate matching package lock
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Verify install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Summarize audit findings without applying broad fixes
        shell: bash
        run: |
          npm audit --json > /tmp/owll-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('/tmp/owll-audit.json', 'utf8'));
          console.log('AUDIT_TOTALS', JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [k,v] of Object.entries(a.vulnerabilities || {})) {
            const via = (v.via || []).filter(x => typeof x === 'object').map(x => x.name + ':' + x.range).slice(0, 3);
            console.log('AUDIT_PACKAGE', k, v.severity, v.isDirect ? 'direct' : 'transitive', via.join('; '), 'fixAvailable=' + JSON.stringify(v.fixAvailable));
          }
          NODE
      - name: Commit generated lock and pinned packages to security branch only
        shell: bash
        run: |
          git config user.name "OWLL Security CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "security: upgrade Next.js and ESLint config to 16.3.8"
            git push origin HEAD:security/next-16-3-8-20261011
          fi
