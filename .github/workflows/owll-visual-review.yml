name: OWLL Visual Review Gallery

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Pages to review"
        type: choice
        options:
          - all
          - home
        default: all
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'content/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/visual-review.cjs'
      - '.github/workflows/owll-visual-review.yml'

permissions:
  contents: read

concurrency:
  group: owll-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    # Only run PR source from this repository; do not execute untrusted forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OWLL_VISUAL_SCOPE: ${{ inputs.scope || 'all' }}
    steps:
      - name: Read source from selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build site for local rendering
        run: npm run build
      - name: Install ephemeral browser QA dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.1 axe-core@4.10.3
      - name: Find isolated browser
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Render and check every selected page
        shell: bash
        run: |
          npm run start -- --port 3000 >/tmp/owll-visual-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/visual-review.cjs
      - name: Save screenshot gallery and audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OWLL-Visual-Review-Gallery
          path: visual-review-output/
          if-no-files-found: warn
          retention-days: 14
