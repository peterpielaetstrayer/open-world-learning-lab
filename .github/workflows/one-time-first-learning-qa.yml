name: One-time OWLL first learning experience QA
on:
  push:
    branches:
      - feature/public-first-learning-experience-20261011
permissions:
  contents: read
jobs:
  qa:
    if: github.event.head_commit.message == 'Run first learning experience QA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock playwright@1.55.1 axe-core@4.10.3
      - run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: |
          npm run start -- --port 3000 >/tmp/owll-first-learning-server.log 2>&1 &
          for i in $(seq 1 45); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            sleep 2
          done
          node scripts/first-learning-qa.cjs
