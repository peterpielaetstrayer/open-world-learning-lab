name: One-time OWLL brand visual QA
on:
  push:
    branches:
      - review/brand-architecture-v2-20261011
permissions:
  contents: read
jobs:
  visual:
    if: github.event.head_commit.message == 'Run final brand visual QA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install site dependencies
        run: npm ci
      - name: Build exact source
        run: npm run build
      - name: Add ephemeral test dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.1 axe-core@4.10.3
      - name: Locate browser or install isolated Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Boot local production build and probe mobile desktop
        shell: bash
        run: |
          npm run start -- --port 3000 >/tmp/owll-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/brand-visual-review.cjs
